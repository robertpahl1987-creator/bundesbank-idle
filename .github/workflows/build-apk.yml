name: APK bauen
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: 3D-Bibliothek einbinden (offline nutzbar)
        run: |
          curl -fsSL -o app/src/main/assets/three.min.js https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js
          sed -i 's#https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js#three.min.js#' app/src/main/assets/index.html
      - name: APK bauen
        run: gradle assembleDebug --no-daemon
      - name: APK umbenennen
        run: cp app/build/outputs/apk/debug/app-debug.apk BundesbankIdle.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BundesbankIdle-APK
          path: BundesbankIdle.apk
      - name: Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.${{ github.run_number }}
          name: Bundesbank Idle v2.1.${{ github.run_number }}
          files: BundesbankIdle.apk
