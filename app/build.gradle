plugins { id 'com.android.application' }

// Versionsnummer kommt automatisch aus GitHub Actions (Build-Nummer)
def run = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace 'de.baasner.bundesbankidle'
    compileSdk 34
    defaultConfig {
        applicationId 'de.baasner.bundesbankidle'
        minSdk 26
        targetSdk 34
        versionCode 100 + run
        versionName "2.4." + run
    }
    // Fester Signaturschlüssel, damit Updates über die alte App installiert werden können
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
        release { minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.core:core:1.12.0'
}
